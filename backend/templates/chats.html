<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои Telegram чаты</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { font-family: sans-serif; background: #f2f2f2; }
        .chat-list { max-width: 600px; margin: 40px auto; background: white; border-radius: 10px; overflow: hidden; }
        .chat-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; transition: background 0.2s; }
        .chat-item:hover { background: #f7f7f7; cursor: pointer; }
        .chat-photo { width: 50px; height: 50px; border-radius: 50%; background: #ccc; overflow: hidden; margin-right: 15px; flex-shrink: 0; }
        .chat-photo img { width: 100%; height: 100%; object-fit: cover; }
        .chat-info { flex-grow: 1; }
        .chat-name { font-weight: bold; color: #333; }
        .chat-msg { color: #777; font-size: 0.9em; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">💬 Мои Telegram чаты</h2>
    <div id="chatList" class="chat-list">Загрузка...</div>

    <script>
        async function loadChats() {
            const res = await fetch("/get_chats");
            const data = await res.json();
            const container = document.getElementById("chatList");
            if (data.error) {
                container.innerHTML = `<p>${data.error}</p>`;
                return;
            }
            container.innerHTML = "";
            data.forEach(chat => {
                const div = document.createElement("div");
                div.className = "chat-item";
                div.innerHTML = `
                    <div class="chat-photo">${chat.photo ? `<img src="${chat.photo}">` : ""}</div>
                    <div class="chat-info">
                        <div class="chat-name">${chat.name}</div>
                        <div class="chat-msg">${chat.message || ""}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        loadChats();
    </script>
</body>
</html>
